<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toshloq tuman hokimi qabuliga onlayn navbat olish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a; /* Hokimiyat rasmiy ko'k rangi */
            --accent: #d97706;  /* Oltinrang liniya */
            --bg: #f8fafc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 550px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-top: 6px solid var(--accent);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            margin: 0 0 5px 0;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .alert-success { background-color: #dcfce7; color: #15803d; }
        .alert-error { background-color: #fee2e2; color: #b91c1c; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
        .btn { background-color: var(--primary); color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn:hover { background-color: #1e40af; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ Toshloq tuman hokimligi</h1>
        <div class="subtitle">Hokim qabuliga onlayn navbat olish elektron platformasi</div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Fuqaro F.I.O (To'liq ism-sharifingiz):</label>
                <input type="text" name="patient_name" required placeholder="Masalan: Asrorxo'ja Aliyev">
            </div>

            <div class="form-group">
                <label>Telefon raqamingiz:</label>
                <input type="tel" name="phone_number" required placeholder="+998 (90) 123-45-67">
            </div>

            <div class="form-group">
                <label>Murojaat mazmuni (qisqacha):</label>
                <textarea name="description" rows="3" placeholder="Murojaat yoki muammoingiz haqida qisqacha yozing..."></textarea>
            </div>

            <div class="form-group">
                <label>O'zingizga qulay qabul kunini va vaqtini tanlang:</label>
                <select name="slot_id" required>
                    <option value="">-- Vaqtni tanlang --</option>
                    {% for slot in slots %}
                        <option value="{{ slot.id }}">{{ slot.date|date:"d-m-Y" }} | Soat: {{ slot.time|time:"H:i" }}</option>
                    {% empty %}
                        <option value="">Hozircha bo'sh qabul vaqtlari mavjud emas</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn">Qabulga yozilish (Navbat olish) 🗓️</button>
        </form>
    </div>
</body>
</html>
