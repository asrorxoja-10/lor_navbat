<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toshloq tuman hokimi qabuliga onlayn navbat olish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Standart yorug' rejim ranglari */
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #ffffff;
            --primary: #1e3a8a; /* Hokimiyat ko'k rangi */
            --accent: #d97706;  /* Oltinrang liniya */
        }

        /* Qorong'u rejim ranglari */
        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #1e293b;
            --primary: #38bdf8; /* Qorong'u rejimda yorqinroq ko'k */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            transition: background-color 0.2s, color 0.2s;
        }
        .container {
            max-width: 550px;
            margin: 50px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-top: 6px solid var(--accent);
            position: relative;
            transition: background-color 0.2s;
        }

        /* Rejimni o'zgartirish tugmasi */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            opacity: 0.9;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            margin: 20px 0 5px 0;
            transition: color 0.2s;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .alert-success { background-color: #dcfce7; color: #15803d; }
        [data-theme="dark"] .alert-success { background-color: #064e3b; color: #6ee7b7; }
        .alert-error { background-color: #fee2e2; color: #b91c1c; }
        [data-theme="dark"] .alert-error { background-color: #4c1d1d; color: #fca5a5; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: var(--text-main); }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <button type="button" class="theme-toggle" id="modeSwitcher">
            <span id="modeIcon">🌙</span> <span id="modeText">Qorong'u</span>
        </button>

        <h1>🏛️ Toshloq tuman hokimligi</h1>
        <div class="subtitle">Hokim qabuliga onlayn navbat olish elektron platformasi</div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Fuqaro F.I.O (To'liq ism-sharifingiz):</label>
                <input type="text" name="patient_name" required placeholder="Masalan: Asrorxo'ja Aliyev">
            </div>

            <div class="form-group">
                <label>Telefon raqamingiz:</label>
                <input type="tel" name="phone_number" required placeholder="+998 (90) 123-45-67">
            </div>

            <div class="form-group">
                <label>Murojaat mazmuni (qisqacha):</label>
                <textarea name="description" rows="3" placeholder="Murojaat yoki muammoingiz haqida qisqacha yozing..."></textarea>
            </div>

            <div class="form-group">
                <label>O'zingizga qulay qabul kunini va vaqtini tanlang:</label>
                <select name="slot_id" required>
                    <option value="">-- Vaqtni tanlang --</option>
                    {% for slot in slots %}
                        <option value="{{ slot.id }}">{{ slot.date|date:"d-m-Y" }} | Soat: {{ slot.time|time:"H:i" }}</option>
                    {% empty %}
                        <option value="">Hozircha bo'sh qabul vaqtlari mavjud emas</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn">Qabulga yozilish (Navbat olish) 🗓️</button>
        </form>
    </div>

    <script>
        const btn = document.getElementById('modeSwitcher');
        const icon = document.getElementById('modeIcon');
        const text = document.getElementById('modeText');

        // Brauzer xotirasidan rejimni tekshirish
        const savedTheme = localStorage.getItem('site-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateInterface(savedTheme);

        btn.addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('site-theme', newTheme);
            updateInterface(newTheme);
        });

        function updateInterface(theme) {
            if (theme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = 'Yorug\'';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'Qorong\'u';
            }
        }
    </script>
</body>
</html>
