<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toshloq tuman hokimi qabuliga onlayn navbat olish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* YORUG' REJIM USLUBLARI (STANDART) */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: all 0.3s ease;

            /* Hokimiyat uchun muhtasham dynamic gradient fon */
            background: linear-gradient(135deg, #eef2f7 0%, #dfe7f0 50%, #cfdae8 100%);
            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 530px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(30, 58, 138, 0.15), 0 8px 10px -6px rgba(30, 58, 138, 0.1);
            border-top: 6px solid #d97706; /* Oltinrang liniya */
            position: relative;
            transition: all 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            color: #1e3a8a; /* Hokimiyat ko'k rangi */
            margin: 15px 0 5px 0;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            margin-bottom: 25px;
            font-size: 13px;
            font-weight: 500;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .alert-success { background-color: #dcfce7; color: #15803d; }
        .alert-error { background-color: #fee2e2; color: #b91c1c; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #0f172a; }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background-color: #ffffff;
            color: #0f172a;
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #1e3a8a; }

        .btn {
            background-color: #1e3a8a;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 5px;
        }
        .btn:hover { background-color: #1e40af; opacity: 0.95; }

        /* QORONG'U REJIM USLUBLARI (DARK MODE) */
        body.dark-mode {
            background: linear-gradient(135deg, #060b14 0%, #0c152b 50%, #122142 100%);
            color: #f8fafc;
        }
        body.dark-mode .container {
            background: #111c33;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }
        body.dark-mode .theme-toggle {
            background: #1a2642;
            border-color: #2e3f69;
            color: #f8fafc;
        }
        body.dark-mode h1 { color: #38bdf8; }
        body.dark-mode .subtitle { color: #94a3b8; }
        body.dark-mode label { color: #f8fafc; }
        body.dark-mode input, body.dark-mode textarea, body.dark-mode select {
            background-color: #172445;
            border-color: #2e3f69;
            color: #f8fafc;
        }
        body.dark-mode input:focus, body.dark-mode textarea:focus, body.dark-mode select:focus { border-color: #38bdf8; }
        body.dark-mode .btn { background-color: #0284c7; }
        body.dark-mode .btn:hover { background-color: #0369a1; }
        body.dark-mode .alert-success { background-color: #064e3b; color: #6ee7b7; }
        body.dark-mode .alert-error { background-color: #4c1d1d; color: #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <button type="button" class="theme-toggle" id="modeSwitcher">
            <span id="modeIcon">🌙</span> <span id="modeText">Qorong'u</span>
        </button>

        <h1>🏛️ Toshloq tuman hokimligi</h1>
        <div class="subtitle">Hokim qabuliga onlayn navbat olish elektron platformasi</div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Fuqaro F.I.O (To'liq ism-sharifingiz):</label>
                <input type="text" name="patient_name" required placeholder="Masalan: Asrorxo'ja Aliyev">
            </div>

            <div class="form-group">
                <label>Telefon raqamingiz:</label>
                <input type="tel" name="phone_number" required placeholder="+998 (90) 123-45-67">
            </div>

            <div class="form-group">
                <label>Murojaat mazmuni (qisqacha):</label>
                <textarea name="description" rows="3" placeholder="Murojaat yoki muammoingiz haqida qisqacha yozing..."></textarea>
            </div>

            <div class="form-group">
                <label>O'zingizga qulay qabul kunini va vaqtini tanlang:</label>
                <select name="slot_id" required>
                    <option value="">-- Vaqtni tanlang --</option>
                    {% for slot in slots %}
                        <option value="{{ slot.id }}">{{ slot.date|date:"d-m-Y" }} | Soat: {{ slot.time|time:"H:i" }}</option>
                    {% empty %}
                        <option value="">Hozircha bo'sh qabul vaqtlari mavjud emas</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn">Qabulga yozilish (Navbat olish) 🗓️</button>
        </form>
    </div>

    <script>
        const switcher = document.getElementById('modeSwitcher');
        const icon = document.getElementById('modeIcon');
        const text = document.getElementById('modeText');
        const body = document.body;

        // Xotiradan rejimni tekshirish va darhol qo'llash
        const savedTheme = localStorage.getItem('site-theme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.textContent = '☀️';
            text.textContent = 'Yorug\'';
        }

        switcher.addEventListener('click', function() {
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('site-theme', 'dark');
                icon.textContent = '☀️';
                text.textContent = 'Yorug\'';
            } else {
                localStorage.setItem('site-theme', 'light');
                icon.textContent = '🌙';
                text.textContent = 'Qorong\'u';
            }
        });
    </script>
</body>
</html>
