<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toshloq tuman hokimi qabuliga onlayn navbat olish</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* STANDART YORUG' REJIM - GERB BILAN */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease;

            /* Orqa fonga Davlat Gerbini joylashtirish (Shaffof va markazda) */
            background-color: #f1f5f9 !important;
            background-image: linear-gradient(rgba(241, 245, 249, 0.9), rgba(241, 245, 249, 0.9)),
                              url("https://upload.wikimedia.org/wikipedia/commons/7/77/Emblem_of_Uzbekistan.svg") !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-size: 450px !important;
            background-attachment: fixed !important;
            color: #0f172a !important;
        }

        .container {
            width: 100%;
            max-width: 530px;
            background: rgba(255, 255, 255, 0.95) !important; /* Gerb ko'rinishi uchun shaffofroq oq card */
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(30, 58, 138, 0.15), 0 8px 10px -6px rgba(30, 58, 138, 0.1);
            border-top: 6px solid #d97706 !important;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #f1f5f9 !important;
            border: 1px solid #cbd5e1 !important;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a !important;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            color: #1e3a8a !important;
            margin: 15px 0 5px 0;
        }
        .subtitle {
            text-align: center;
            color: #475569 !important;
            margin-bottom: 30px;
            font-size: 13.5px;
        }

        .alert {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .alert-success { background-color: #dcfce7 !important; color: #15803d !important; border-left: 4px solid #22c55e !important; }
        .alert-error { background-color: #fee2e2 !important; color: #b91c1c !important; border-left: 4px solid #ef4444 !important; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #0f172a !important; }

        input, textarea, select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #cbd5e1 !important;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background-color: #ffffff !important;
            color: #0f172a !important;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1e3a8a !important;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15) !important;
        }

        .btn {
            background-color: #1e3a8a !important;
            color: #ffffff !important;
            padding: 15px;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            margin-top: 10px;
        }

        /* QORONG'U REJIM STILLARI (MAJBURIY OVERRIDE) */
        body.dark-mode {
            background-color: #0b1329 !important;
            background-image: linear-gradient(rgba(11, 19, 41, 0.92), rgba(11, 19, 41, 0.92)),
                              url("https://upload.wikimedia.org/wikipedia/commons/7/77/Emblem_of_Uzbekistan.svg") !important;
            color: #f8fafc !important;
        }
        body.dark-mode .container {
            background: rgba(30, 41, 59, 0.9) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
        }
        body.dark-mode .theme-toggle {
            background: #172445 !important;
            border-color: #2e3f69 !important;
            color: #f8fafc !important;
        }
        body.dark-mode h1 { color: #38bdf8 !important; }
        body.dark-mode .subtitle { color: #94a3b8 !important; }
        body.dark-mode label { color: #f8fafc !important; }
        body.dark-mode input, body.dark-mode textarea, body.dark-mode select {
            background-color: #172445 !important;
            border-color: #2e3f69 !important;
            color: #f8fafc !important;
        }
        body.dark-mode input:focus, body.dark-mode textarea:focus, body.dark-mode select:focus { border-color: #38bdf8 !important; }
        body.dark-mode .btn { background-color: #0284c7 !important; }
        body.dark-mode .alert-success { background-color: #064e3b !important; color: #a7f3d0 !important; }
        body.dark-mode .alert-error { background-color: #4c1d1d !important; color: #fca5a5 !important; }
    </style>
</head>
<body>
    <span style="display:none;" id="cache-buster">v={{ v }}</span>

    <div class="container">
        <button type="button" class="theme-toggle" id="modeSwitcher">
            <span id="modeIcon">🌙</span> <span id="modeText">Qorong'u</span>
        </button>

        <h1>🏛️ Toshloq tuman hokimligi</h1>
        <div class="subtitle">Hokim qabuliga onlayn navbat olish elektron platformasi</div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Fuqaro F.I.O (To'liq ism-sharifingiz):</label>
                <input type="text" name="patient_name" required placeholder="Masalan: Asrorxo'ja Aliyev">
            </div>

            <div class="form-group">
                <label>Telefon raqamingiz:</label>
                <input type="tel" name="phone_number" required placeholder="+998 (90) 123-45-67">
            </div>

            <div class="form-group">
                <label>Murojaat mazmuni (qisqacha):</label>
                <textarea name="description" rows="3" placeholder="Murojaat yoki muammoingiz haqida qisqacha yozing..."></textarea>
            </div>

            <div class="form-group">
                <label>O'zingizga qulay qabul kunini va vaqtini tanlang:</label>
                <select name="slot_id" required>
                    <option value="">-- Vaqtni tanlang --</option>
                    {% for slot in slots %}
                        <option value="{{ slot.id }}">{{ slot.date|date:"d-m-Y" }} | Soat: {{ slot.time|time:"H:i" }}</option>
                    {% empty %}
                        <option value="">Hozircha bo'sh qabul vaqtlari mutable emas</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn">Qabulga yozilish (Navbat olish) 🗓️</button>
        </form>
    </div>

    <script>
        const switcher = document.getElementById('modeSwitcher');
        const icon = document.getElementById('modeIcon');
        const text = document.getElementById('modeText');
        const body = document.body;

        const savedTheme = localStorage.getItem('site-theme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.textContent = '☀️';
            text.textContent = 'Yorug\'';
        }

        switcher.addEventListener('click', function() {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('site-theme', 'dark');
                icon.textContent = '☀️';
                text.textContent = 'Yorug\'';
            } else {
                localStorage.setItem('site-theme', 'light');
                icon.textContent = '🌙';
                text.textContent = 'Qorong\'u';
            }
        });
    </script>
</body>
</html>
