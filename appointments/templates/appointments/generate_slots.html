{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 30px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); color: #f8fafc; font-family: sans-serif;">
    <h2 style="margin-top: 0; color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px;">⚙️ Avtomatik Vaqt Generator boti</h2>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #cbd5e1;">{{ field.label }}:</label>
                <div style="color: #000;">{{ field }}</div>
                {% if field.errors %}
                    <p style="color: #ef4444; font-size: 12px;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button type="submit" style="background: #10b981; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1;">⚡ Vaqtlarni Yaratish</button>
            <a href="../" style="background: #475569; color: white; text-decoration: none; text-align: center; padding: 10px 20px; font-weight: bold; border-radius: 6px; flex: 1;">Orqaga qaytish</a>
        </div>
    </form>
</div>
{% endblock %}
